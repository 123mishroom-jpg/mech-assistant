<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>机械工程问答助手</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
    />
    <script defer src="/js/app.js"></script>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <div>
          <h1>机械工程问答助手</h1>
          <p>输入力学、机构、制图、设计等问题，AI 将为你解答。</p>
        </div>
      </header>

      <main class="main">
        <section id="chat" class="chat" aria-live="polite"></section>

        <form id="chat-form" class="composer">
          <label class="sr-only" for="question">你的问题</label>
          <textarea
            id="question"
            name="question"
            rows="4"
            placeholder="例如：什么是应力集中？四连杆机构有哪些应用？"
            maxlength="2000"
            required
          ></textarea>
          <div class="composer-actions">
            <span id="char-count" class="char-count">0 / 2000</span>
            <button id="submit-btn" type="submit">发送问题</button>
          </div>
        </form>
      </main>
    </div>
  </body>
</html>
